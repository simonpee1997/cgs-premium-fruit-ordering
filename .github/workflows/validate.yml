name: Validate CHIPSTI POS
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Locate Chromium
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run test:browser
